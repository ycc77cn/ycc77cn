<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="shortcut icon" href="https://pic1.imgdb.cn/item/68f1b8ccc5157e1a887a8c09.png" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具目录</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img class="site-logo" src="https://pic1.imgdb.cn/item/68f1b8ccc5157e1a887a8c09.png" alt="站点Logo" />
        <div class="titles">
          <h1 class="site-title">杨CC资源站-纯AI版</h1>
          <p class="site-subtitle">工欲善其事，必先利其器</p>
        </div>
      </div>
      <div class="search" role="search">
        <input id="searchInput" class="search-input" type="text" placeholder="搜索分类 / 子类 / 工具…" aria-label="站内搜索" />
        <button id="searchClear" class="search-clear" aria-label="清除搜索" title="清除">×</button>
        <div id="searchResults" class="search-results" role="listbox" aria-label="搜索结果" hidden></div>
      </div>
    </div>
  </header>

  <nav class="category-bar" id="categoryBar" aria-label="主分类"></nav>

  <div class="subcategory-panel" id="subcategoryPanel" aria-label="二级分类"></div>

  <div id="searchResults" class="search-results" role="listbox" aria-label="搜索结果" hidden></div>

  <main class="content" id="content" aria-live="polite"></main>

  <footer class="site-footer">杨CC 工具目录 · 纯AI版本</footer>

  <script src="./app.js" defer></script>
</body>
</html>
